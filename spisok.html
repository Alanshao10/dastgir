const tbody = document.querySelector('#t tbody');
const q = document.getElementById('q');
const seg = document.getElementById('seg');
const countEl = document.getElementById('count');
let sortKey = 'т2024', sortDir = -1;

[...new Set(data.map(r => r.сегмент))].sort().forEach(s => {
  const o = document.createElement('option'); o.value = s; o.textContent = s; seg.appendChild(o);
});

function cls(segment) {
  if (!segment) return 'tag';
  if (segment.includes('Огнеупоры') || segment.includes('Химия') || segment.includes('Ферросплавы') || segment.includes('Металлургия') || segment.includes('Стекло')) return 'tag plant';
  return 'tag trade';
}

function render() {
  const needle = q.value.trim().toLowerCase();
  const chosen = seg.value;
  let list = data.filter(r => {
    const hay = (r.компания + ' ' + r.город + ' ' + r.инн).toLowerCase();
    return (!needle || hay.includes(needle)) && (!chosen || r.сегмент === chosen);
  });
  list.sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
    return String(av).localeCompare(String(bv), 'ru') * sortDir;
  });
  tbody.innerHTML = list.map(r => {
    const tel = r.телефон ? `<div><a href="tel:${r.телефон.replace(/[^+0-9]/g, '')}">${r.телефон}</a></div>`
                          : `<div class="hint"><a href="https://www.rusprofile.ru/search?query=${r.инн}" target="_blank">телефон в карточке</a></div>`;
    const mail = r.почта ? `<div><a href="mailto:${r.почта}">${r.почта}</a></div>` : '';
    const site = r.сайт ? `<div class="hint"><a href="${r.сайт}" target="_blank">сайт</a></div>` : '';
    const note = r.заметка ? `<div class="${r.заметка.includes('прекращена') ? 'warn' : 'hint'}">${r.заметка}</div>` : '';
    return `<tr>
      <td class="num">${r.n}</td>
      <td><b>${r.компания}</b><div class="city">${r.город}</div>${note}</td>
      <td class="hint">${r.инн}</td>
      <td><span class="${cls(r.сегмент)}">${r.сегмент}</span></td>
      <td>${tel}${mail}${site}</td>
      <td class="num">${r.т2024.toLocaleString('ru-RU')}</td>
      <td class="num">${r.цена ? '$' + r.цена : '—'}</td>
    </tr>`;
  }).join('');
  countEl.textContent = list.length + ' из ' + data.length;
}

document.querySelectorAll('th[data-k]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.k;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = key === 'компания' || key === 'сегмент' ? 1 : -1; }
    render();
  });
});
q.addEventListener('input', render);
seg.addEventListener('change', render);
render();
</script>
